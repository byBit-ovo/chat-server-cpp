<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>IM Chat</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft Yahei",sans-serif;font-size:14px;color:#333;background:#ededed;height:100vh;overflow:hidden}

/* ===== 公共 ===== */
.hidden{display:none!important}
.btn{padding:8px 18px;border:none;border-radius:4px;cursor:pointer;font-size:14px;transition:background .15s}
.btn-primary{background:#07c160;color:#fff}.btn-primary:hover{background:#06ad56}
.btn-primary:disabled{background:#a8d8b9;cursor:not-allowed}
.btn-ghost{background:transparent;border:1px solid #07c160;color:#07c160}.btn-ghost:hover{background:rgba(7,193,96,.08)}
.btn-danger{background:#fa5151;color:#fff}.btn-danger:hover{background:#e0404f}
.btn-sm{padding:4px 12px;font-size:12px}

/* ===== 登录/注册页 ===== */
#authPage{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(160deg,#2c2d30,#393a3e)}
.auth-box{width:380px;background:#fff;border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.2);overflow:hidden}
.auth-tabs{display:flex;border-bottom:1px solid #eee}
.auth-tab{flex:1;padding:14px;text-align:center;cursor:pointer;font-size:15px;color:#999;transition:all .2s}
.auth-tab.active{color:#07c160;border-bottom:2px solid #07c160;font-weight:500}
.auth-form{padding:28px 32px}
.auth-form .field{margin-bottom:14px}
.auth-form label{display:block;margin-bottom:5px;font-size:13px;color:#666}
.auth-form input{width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:4px;font-size:14px}
.auth-form input:focus{outline:none;border-color:#07c160}
.auth-form .btn{width:100%;margin-top:6px;padding:11px}
.auth-settings{padding:0 32px 24px}
.auth-settings label{font-size:12px;color:#999}
.auth-settings input{width:100%;padding:7px 10px;border:1px solid #eee;border-radius:4px;font-size:13px;margin-top:4px;margin-bottom:10px}

/* ===== 主布局 ===== */
#app{display:none;height:100vh;flex-direction:column}
#app.show{display:flex}
.app-body{display:flex;flex:1;min-height:0}

/* ===== 左侧导航条 ===== */
.nav-bar{width:54px;background:#2c2d30;display:flex;flex-direction:column;align-items:center;padding:8px 0;flex-shrink:0}
.nav-avatar{width:36px;height:36px;border-radius:50%;background:#07c160;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;margin-bottom:12px;cursor:pointer;overflow:hidden}
.nav-avatar img{width:100%;height:100%;object-fit:cover}
.nav-sep{width:30px;height:1px;background:#444;margin:8px 0}
.nav-btn{width:38px;height:38px;border:none;background:transparent;color:#aaa;font-size:20px;border-radius:6px;cursor:pointer;margin:3px 0;display:flex;align-items:center;justify-content:center;transition:all .15s;position:relative}
.nav-btn:hover{color:#fff;background:rgba(255,255,255,.1)}
.nav-btn.active{color:#fff;background:rgba(255,255,255,.15)}
.nav-btn .badge{position:absolute;top:2px;right:2px;min-width:16px;height:16px;background:#fa5151;border-radius:8px;font-size:10px;color:#fff;line-height:16px;text-align:center;padding:0 4px}

/* ===== 面板容器 ===== */
.panel{width:260px;flex-shrink:0;display:flex;flex-direction:column;background:#f7f7f7;border-right:1px solid #e0e0e0}
.panel-header{height:52px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e7e7e7;background:#f7f7f7}
.panel-header .title{font-size:15px;font-weight:500;color:#333}
.panel-search{padding:8px 12px;border-bottom:1px solid #eee}
.panel-search input{width:100%;padding:6px 10px;border:1px solid #e0e0e0;border-radius:16px;font-size:13px;background:#fff}
.panel-search input:focus{outline:none;border-color:#07c160}
.panel-list{flex:1;overflow-y:auto}

/* ===== 会话列表 ===== */
.conv-item{display:flex;align-items:center;padding:10px 14px;cursor:pointer;border-bottom:1px solid #f0f0f0;background:#fff;transition:background .12s}
.conv-item:hover{background:#f5f5f5}
.conv-item.active{background:#e7e7e7}
.conv-item .ava{width:42px;height:42px;border-radius:6px;background:#ddd;color:#666;display:flex;align-items:center;justify-content:center;font-size:16px;margin-right:10px;flex-shrink:0;overflow:hidden}
.conv-item .ava img{width:100%;height:100%;object-fit:cover}
.conv-item .body{flex:1;min-width:0}
.conv-item .name{font-size:14px;color:#333;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:2px}
.conv-item .preview{font-size:12px;color:#999;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv-item .meta{flex-shrink:0;text-align:right}
.conv-item .time{font-size:11px;color:#bbb;margin-bottom:3px}
.conv-item .unread{display:inline-block;min-width:16px;height:16px;padding:0 4px;line-height:16px;font-size:11px;color:#fff;background:#fa5151;border-radius:8px;text-align:center}

/* ===== 联系人列表 ===== */
.contact-section{padding:6px 0}
.contact-section-title{padding:4px 14px;font-size:12px;color:#999;background:#f2f2f2}
.contact-item{display:flex;align-items:center;padding:10px 14px;cursor:pointer;border-bottom:1px solid #f5f5f5;background:#fff;transition:background .12s}
.contact-item:hover{background:#f5f5f5}
.contact-item.active{background:#e7e7e7}
.contact-item .ava{width:38px;height:38px;border-radius:6px;background:#ddd;color:#666;display:flex;align-items:center;justify-content:center;font-size:15px;margin-right:10px;flex-shrink:0;overflow:hidden}
.contact-item .ava img{width:100%;height:100%;object-fit:cover}
.contact-item .name{flex:1;font-size:14px;color:#333;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.contact-item .actions{display:flex;gap:6px}
.contact-item .actions button{padding:4px 10px;font-size:12px}

/* ===== 聊天区域 ===== */
.chat-area{flex:1;display:flex;flex-direction:column;min-width:0;background:#f5f5f5}
.chat-placeholder{flex:1;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:14px;background:#f5f5f5}
.chat-header{height:52px;padding:0 16px;display:flex;align-items:center;background:#f7f7f7;border-bottom:1px solid #e7e7e7;flex-shrink:0}
.chat-header .name{font-size:15px;font-weight:500;flex:1}
.chat-header .actions{display:flex;gap:6px}
.chat-header .icon-btn{width:34px;height:34px;border:none;background:transparent;color:#666;font-size:18px;border-radius:4px;cursor:pointer}
.chat-header .icon-btn:hover{background:#e8e8e8}
.chat-msgs{flex:1;overflow-y:auto;padding:14px 16px}
.msg-date{text-align:center;margin:10px 0;font-size:11px;color:#bbb}
.msg-row{display:flex;margin-bottom:14px;align-items:flex-start}
.msg-row.self{flex-direction:row-reverse}
.msg-row .ava{width:38px;height:38px;border-radius:6px;background:#ddd;color:#666;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;margin:0 8px;overflow:hidden}
.msg-row .ava img{width:100%;height:100%;object-fit:cover}
.msg-row .wrap{max-width:62%;display:flex;flex-direction:column;align-items:flex-start}
.msg-row.self .wrap{align-items:flex-end}
.msg-row .sender-name{font-size:11px;color:#999;margin-bottom:3px}
.bubble{padding:9px 13px;border-radius:4px;font-size:14px;line-height:1.55;word-break:break-word;max-width:100%}
.bubble.other{background:#fff;border:1px solid #eee;border-top-left-radius:0}
.bubble.self{background:#95ec69;border-top-right-radius:0}
.bubble.file-bubble{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer}
.bubble.file-bubble .file-icon{font-size:26px;flex-shrink:0}
.bubble.file-bubble .file-info .fname{font-size:13px;font-weight:500}
.bubble.file-bubble .file-info .fsize{font-size:11px;color:#888;margin-top:2px}
.bubble img.chat-img{max-width:180px;max-height:180px;border-radius:4px;cursor:pointer;display:block}
.msg-time{margin-top:3px;font-size:11px;color:#bbb}

/* ===== 输入区 ===== */
.chat-input-area{flex-shrink:0;background:#f7f7f7;border-top:1px solid #e7e7e7}
.chat-toolbar{display:flex;align-items:center;padding:6px 12px 0;gap:4px}
.chat-toolbar .tool-btn{width:30px;height:30px;border:none;background:transparent;color:#666;font-size:18px;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.chat-toolbar .tool-btn:hover{background:#e8e8e8}
.chat-input-row{display:flex;align-items:flex-end;padding:8px 12px 12px;gap:8px}
.chat-input-row textarea{flex:1;min-height:38px;max-height:110px;padding:9px 12px;border:1px solid #e0e0e0;border-radius:4px;font-size:14px;font-family:inherit;resize:none;background:#fff}
.chat-input-row textarea:focus{outline:none;border-color:#07c160}
.chat-input-row .btn-send{width:64px;height:38px;flex-shrink:0}

/* ===== 搜索好友面板 ===== */
.search-result{padding:8px 0}
.search-result-item{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid #f5f5f5;background:#fff}
.search-result-item .ava{width:38px;height:38px;border-radius:6px;background:#5b9bd5;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;margin-right:10px;flex-shrink:0}
.search-result-item .name{flex:1;font-size:14px}

/* ===== 模态框 ===== */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal{background:#fff;border-radius:8px;padding:24px;width:400px;box-shadow:0 8px 32px rgba(0,0,0,.18);max-height:80vh;overflow-y:auto}
.modal h3{font-size:16px;font-weight:500;margin-bottom:16px}
.modal .field{margin-bottom:14px}
.modal .field label{display:block;margin-bottom:5px;font-size:13px;color:#666}
.modal .field input,.modal .field textarea{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:4px;font-size:14px}
.modal .field input:focus,.modal .field textarea:focus{outline:none;border-color:#07c160}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.member-tags{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0}
.member-tag{display:flex;align-items:center;padding:4px 10px;background:#f0f9f0;border:1px solid #b7e4c7;border-radius:16px;font-size:13px;color:#333}
.member-tag .remove{margin-left:6px;cursor:pointer;color:#999;font-size:12px}
.friend-pick-list{max-height:200px;overflow-y:auto;border:1px solid #eee;border-radius:4px}
.friend-pick-item{display:flex;align-items:center;padding:8px 12px;cursor:pointer;border-bottom:1px solid #f5f5f5}
.friend-pick-item:hover{background:#f5f5f5}
.friend-pick-item input[type=checkbox]{margin-right:10px}

/* ===== 用户详情侧栏 ===== */
.profile-panel{width:220px;flex-shrink:0;background:#fafafa;border-left:1px solid #e7e7e7;padding:20px 16px;display:flex;flex-direction:column;align-items:center}
.profile-panel .big-ava{width:64px;height:64px;border-radius:10px;background:#ddd;display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:10px;overflow:hidden}
.profile-panel .big-ava img{width:100%;height:100%;object-fit:cover}
.profile-panel .pname{font-size:16px;font-weight:500;margin-bottom:4px;text-align:center}
.profile-panel .pdesc{font-size:13px;color:#999;margin-bottom:16px;text-align:center;word-break:break-all}
.profile-panel .btn{width:100%;margin-bottom:8px}
.member-list{width:100%;margin-top:8px}
.member-list-title{font-size:12px;color:#999;margin-bottom:6px}
.member-list-item{display:flex;align-items:center;padding:5px 0;font-size:13px}
.member-list-item .ava{width:28px;height:28px;border-radius:4px;background:#ddd;display:flex;align-items:center;justify-content:center;font-size:12px;margin-right:8px;overflow:hidden}

/* ===== toast ===== */
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;padding:8px 20px;border-radius:20px;font-size:14px;z-index:9999;transition:opacity .3s;pointer-events:none}
</style>
</head>
<body>

<!-- ===== 登录/注册 ===== -->
<div id="authPage">
  <div class="auth-box">
    <div class="auth-tabs">
      <div class="auth-tab active" data-tab="login">登录</div>
      <div class="auth-tab" data-tab="register">注册</div>
    </div>
    <div id="loginForm" class="auth-form">
      <div class="field"><label>用户名（昵称）</label><input id="loginNick" placeholder="请输入昵称"/></div>
      <div class="field"><label>密码</label><input id="loginPwd" type="password" placeholder="请输入密码"/></div>
      <button class="btn btn-primary" id="btnLogin">登 录</button>
    </div>
    <div id="registerForm" class="auth-form hidden">
      <div class="field"><label>昵称</label><input id="regNick" placeholder="请输入昵称"/></div>
      <div class="field"><label>密码</label><input id="regPwd" type="password" placeholder="请输入密码"/></div>
      <button class="btn btn-primary" id="btnRegister">注 册</button>
    </div>
    <div class="auth-settings">
      <label>HTTP 接口地址</label>
      <input id="apiBase"/>
      <label>WebSocket 地址</label>
      <input id="wsBase"/>
    </div>
  </div>
</div>

<!-- ===== 主界面 ===== -->
<div id="app">
  <div class="app-body">
    <!-- 左侧导航 -->
    <div class="nav-bar">
      <div class="nav-avatar" id="myAvatar" title="我的信息"></div>
      <div class="nav-sep"></div>
      <button class="nav-btn active" id="navChat" title="聊天">💬</button>
      <button class="nav-btn" id="navContacts" title="联系人">👥</button>
      <button class="nav-btn" id="navSearch" title="搜索好友">🔍</button>
    </div>

    <!-- 会话面板 -->
    <div class="panel" id="panelChat">
      <div class="panel-header">
        <span class="title">聊天</span>
        <button class="btn btn-sm btn-ghost" id="btnCreateGroup">+ 建群</button>
      </div>
      <div class="panel-list" id="convList"></div>
    </div>

    <!-- 联系人面板 -->
    <div class="panel hidden" id="panelContacts">
      <div class="panel-header">
        <span class="title">联系人</span>
        <button class="btn btn-sm btn-ghost" id="btnShowPending">好友申请</button>
      </div>
      <div class="panel-search">
        <input id="contactSearch" placeholder="搜索好友"/>
      </div>
      <div class="panel-list" id="contactList"></div>
    </div>

    <!-- 搜索好友面板 -->
    <div class="panel hidden" id="panelSearch">
      <div class="panel-header"><span class="title">搜索好友</span></div>
      <div class="panel-search" style="padding-bottom:0">
        <input id="searchInput" placeholder="搜索昵称"/>
        <button class="btn btn-primary btn-sm" id="btnSearch" style="width:100%;margin-top:6px;margin-bottom:8px">搜索</button>
      </div>
      <div class="panel-list" id="searchResults"></div>
    </div>

    <!-- 聊天区域 -->
    <div class="chat-area" id="chatArea">
      <div class="chat-placeholder" id="chatPlaceholder">从左侧选择会话开始聊天</div>
      <!-- 聊天窗口（选中会话后显示）-->
      <div id="chatWindow" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0">
        <div class="chat-header">
          <span class="name" id="chatTitle"></span>
          <div class="actions">
            <button class="icon-btn" id="btnToggleProfile" title="详情">⋯</button>
          </div>
        </div>
        <div class="chat-msgs" id="chatMsgs"></div>
        <div class="chat-input-area">
          <div class="chat-toolbar">
            <label class="tool-btn" title="发送图片">🖼
              <input id="imgInput" type="file" accept="image/*" class="hidden"/>
            </label>
            <label class="tool-btn" title="发送文件">📎
              <input id="fileInput" type="file" class="hidden"/>
            </label>
          </div>
          <div class="chat-input-row">
            <textarea id="msgInput" placeholder="输入消息，Enter 发送，Shift+Enter 换行" rows="1"></textarea>
            <button class="btn btn-primary btn-send" id="btnSend">发送</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 详情侧栏（点击⋯展开）-->
    <div class="profile-panel hidden" id="profilePanel">
      <div class="big-ava" id="profileAva"></div>
      <div class="pname" id="profileName"></div>
      <div class="pdesc" id="profileDesc"></div>
      <button class="btn btn-danger btn-sm" id="btnRemoveFriend" style="display:none">删除好友</button>
      <div class="member-list" id="memberList"></div>
    </div>
  </div>
</div>

<!-- ===== 建群 Modal ===== -->
<div class="modal-backdrop hidden" id="modalCreateGroup">
  <div class="modal">
    <h3>创建群聊</h3>
    <div class="field"><label>群名称</label><input id="groupName" placeholder="请输入群名称"/></div>
    <div class="field"><label>选择成员（好友）</label>
      <div class="friend-pick-list" id="friendPickList"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="btnCancelGroup">取消</button>
      <button class="btn btn-primary" id="btnConfirmGroup">创建</button>
    </div>
  </div>
</div>

<!-- ===== 好友申请 Modal ===== -->
<div class="modal-backdrop hidden" id="modalPending">
  <div class="modal">
    <h3>好友申请</h3>
    <div id="pendingList" style="max-height:320px;overflow-y:auto"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="btnClosePending">关闭</button>
    </div>
  </div>
</div>

<!-- toast -->
<div id="toast" class="hidden"></div>

<!-- ===== 隐藏文件下载链接 ===== -->
<a id="dlLink" style="display:none"></a>

<script src="https://cdn.jsdelivr.net/npm/protobufjs@7/dist/protobuf.min.js"></script>
<script>
(function(){
'use strict';

// ================== 状态 ==================
var S = {
  apiBase: '', wsBase: '',
  sessionId: '', myUserId: '', myNick: '',
  pbRoot: null,
  ws: null, wsReady: false,
  ackQueue: [],
  convs: [],          // ChatSessionInfo[]
  friends: [],        // UserInfo[]
  pendingEvents: [],  // FriendEvent[]
  msgs: {},           // chatSessionId -> MessageInfo[]
  selectedConv: null, // ChatSessionInfo
  showProfile: false,
  memberCache: {},    // chatSessionId -> UserInfo[]
  pendingBadge: 0,
};

// ================== 工具 ==================
function uuid(){
  return typeof crypto!=='undefined'&&crypto.randomUUID
    ? crypto.randomUUID()
    : 'x'+Date.now().toString(36)+Math.random().toString(36).substr(2,9);
}
function fmtTime(ts){
  var d = ts ? new Date(Number(ts)) : new Date();
  var h=d.getHours(),m=d.getMinutes();
  return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;
}
function fmtSize(bytes){
  if(bytes<1024) return bytes+'B';
  if(bytes<1024*1024) return (bytes/1024).toFixed(1)+'KB';
  return (bytes/1024/1024).toFixed(1)+'MB';
}
function esc(s){ var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function el(id){ return document.getElementById(id); }
function showToast(msg, dur){
  var t=el('toast'); t.textContent=msg; t.classList.remove('hidden');
  setTimeout(function(){ t.classList.add('hidden'); }, dur||2000);
}
function bytesToBase64(arr){
  var bin=''; for(var i=0;i<arr.length;i++) bin+=String.fromCharCode(arr[i]);
  return btoa(bin);
}
function avatarEl(nickname, avatarBytes){
  var d=document.createElement('div'); d.className='ava';
  if(avatarBytes && avatarBytes.length){
    var img=document.createElement('img');
    img.src='data:image/jpeg;base64,'+bytesToBase64(avatarBytes);
    d.appendChild(img);
  } else {
    d.textContent=(nickname||'?').charAt(0);
  }
  return d;
}

// ================== Proto ==================
function loadProtos(){
  if(S.pbRoot) return Promise.resolve(S.pbRoot);
  var root=new protobuf.Root();
  var protos=['proto/base.proto','proto/user.proto','proto/friend.proto',
    'proto/message.proto','proto/transmite.proto','proto/notify.proto','proto/gateway.proto'];
  return protos.reduce(function(p,f){ return p.then(function(){ return root.load(f); }); }, Promise.resolve())
    .then(function(){ S.pbRoot=root; return root; });
}

// ================== HTTP ==================
function apiFetch(method, path, ReqType, reqObj, RspType){
  var msg=ReqType.create(reqObj);
  var buf=ReqType.encode(msg).finish();
  return fetch(S.apiBase+path,{
    method: method,
    headers:{'Content-Type':'application/x-protobuf'},
    body: buf
  }).then(function(r){ return r.arrayBuffer(); })
    .then(function(ab){ return RspType.decode(new Uint8Array(ab)); });
}
function apiPost(path, ReqType, reqObj, RspType){ return apiFetch('POST',path,ReqType,reqObj,RspType); }

function pb(name){ return S.pbRoot.lookupType('MY_IM.'+name); }
function penum(name){ return S.pbRoot.lookupEnum('MY_IM.'+name).values; }

// ================== WebSocket ==================
function connectWs(){
  if(!S.wsBase||!S.sessionId) return;
  try{ S.ws=new WebSocket(S.wsBase); }catch(e){ return; }
  S.ws.binaryType='arraybuffer';
  S.ws.onopen=function(){
    S.wsReady=true;
    var Req=pb('ClientAuthenticationReq');
    S.ws.send(Req.encode(Req.create({request_id:uuid(),session_id:S.sessionId})).finish());
  };
  S.ws.onmessage=function(ev){
    try{
      var NotifyMsg=pb('NotifyMessage');
      var msg=NotifyMsg.decode(new Uint8Array(ev.data));
      if(msg.notify_event_id) S.ackQueue.push(msg.notify_event_id);
      handleNotify(msg);
      flushAck();
    }catch(e){}
  };
  S.ws.onclose=function(){ S.ws=null; S.wsReady=false; };
  S.ws.onerror=function(){ S.ws=null; S.wsReady=false; };
}
function flushAck(){
  if(!S.ackQueue.length||!S.ws||S.ws.readyState!==WebSocket.OPEN) return;
  var Req=pb('NotifyAckReq');
  S.ws.send(Req.encode(Req.create({request_id:uuid(),notify_event_id_list:S.ackQueue.slice()})).finish());
  S.ackQueue=[];
}
function handleNotify(msg){
  var NT=penum('NotifyType');
  switch(msg.notify_type){
    case NT.CHAT_MESSAGE_NOTIFY:
      if(msg.new_message_info&&msg.new_message_info.message_info)
        ingestMsg(msg.new_message_info.message_info);
      break;
    case NT.FRIEND_ADD_APPLY_NOTIFY:
      showToast('收到好友申请');
      S.pendingBadge++;
      renderNavBadge();
      loadPendingFriends();
      break;
    case NT.FRIEND_ADD_PROCESS_NOTIFY:
      if(msg.friend_process_result&&msg.friend_process_result.agree){
        showToast('好友申请已通过');
        loadFriends();
        loadConvs();
      } else {
        showToast('好友申请被拒绝');
      }
      break;
    case NT.CHAT_SESSION_CREATE_NOTIFY:
      loadConvs();
      break;
    case NT.FRIEND_REMOVE_NOTIFY:
      loadFriends(); loadConvs();
      break;
    case NT.NOTIFY_SYNC:
      syncMessages();
      break;
  }
}

function syncMessages(){
  var maxId=0;
  Object.keys(S.msgs).forEach(function(cid){
    (S.msgs[cid]||[]).forEach(function(m){
      var n=parseInt(m.message_id,10)||0; if(n>maxId) maxId=n;
    });
  });
  apiPost('/chat/message_storage/get_sync', pb('GetSyncMsgReq'),
    {request_id:uuid(), session_id:S.sessionId, cur_max_message_id:maxId, msg_count:100},
    pb('GetSyncMsgRsp'))
  .then(function(rsp){
    if(rsp.success&&rsp.msg_list) rsp.msg_list.forEach(function(m){ ingestMsg(m); });
  }).catch(function(){});

     chat_session_id:S.selectedConv.chat_session_id,

    pb('NewMessageRsp'))

function sendImageMsg(fileId, imageBytes){

  return apiPost('/chat/message_transmit/new_message', pb('NewMessageReq'),
    {request_id:uuid(), session_id:S.sessionId,

    pb('NewMessageRsp'))

function ingestMsg(mi, noRender){
  var cid=mi.chat_session_id||'';
  if(!S.msgs[cid]) S.msgs[cid]=[];
  // 去重
  var dup=S.msgs[cid].some(function(m){ return m.message_id&&m.message_id===mi.message_id; });
  if(!dup) S.msgs[cid].push(mi);
  // 更新会话预览
  var conv=S.convs.find(function(c){ return c.chat_session_id===cid; });
  if(conv) conv.prev_message=mi;
  renderConvList();
  if(S.selectedConv&&S.selectedConv.chat_session_id===cid&&!noRender) renderMsgs();
}

// ================== 文件 ==================
function uploadFile(fileObj){
  return new Promise(function(resolve,reject){
    var reader=new FileReader();
    reader.onload=function(e){
      var content=new Uint8Array(e.target.result);
      apiPost('/chat/file/put_single_file', pb('PutSingleFileReq'),
        {request_id:uuid(), session_id:S.sessionId,
         file_data:{file_name:fileObj.name, file_size:fileObj.size, file_content:content}},
        pb('PutSingleFileRsp'))
      .then(function(rsp){
        if(rsp.success&&rsp.file_info) resolve(rsp.file_info);
        else reject(new Error(rsp.errmsg||'上传失败'));
      }).catch(reject);
    };
    reader.readAsArrayBuffer(fileObj);
  });
}
function downloadFile(fileId, fileName){
  apiPost('/chat/file/get_single_file', pb('GetSingleFileReq'),
    {request_id:uuid(), session_id:S.sessionId, file_id:fileId}, pb('GetSingleFileRsp'))
  .then(function(rsp){
    if(!rsp.success||!rsp.file_data){ showToast('下载失败'); return; }
    var blob=new Blob([rsp.file_data.file_content]);
    var url=URL.createObjectURL(blob);
    var a=el('dlLink'); a.href=url; a.download=fileName||fileId; a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); },3000);
  }).catch(function(){ showToast('下载失败'); });
}

function renderConvList(){
  var list=el('convList'); list.innerHTML='';
  S.convs.forEach(function(c){
    var isSingle=!!c.single_chat_friend_id;
    var preview='';
    if(c.prev_message&&c.prev_message.message){
      var m=c.prev_message.message;
      if(m.string_message) preview=m.string_message.content||'';
      else if(m.file_message) preview='[文件] '+m.file_message.file_name;
      else if(m.image_message) preview='[图片]';
      else if(m.speech_message) preview='[语音]';
    }
    var div=document.createElement('div');
    div.className='conv-item'+(S.selectedConv&&S.selectedConv.chat_session_id===c.chat_session_id?' active':'');
    div.innerHTML='<div class="ava">'+(isSingle?'👤':'👥')+'</div>'+
      '<div class="body">'+
        '<div class="name">'+esc(c.chat_session_name||c.chat_session_id)+'</div>'+
        '<div class="preview">'+esc(preview)+'</div>'+
      '</div>'+
      '<div class="meta"><div class="time">'+(c.prev_message&&c.prev_message.timestamp?fmtTime(c.prev_message.timestamp):'')+'</div></div>';

function renderMsgs(){
  var area=el('chatMsgs'); area.innerHTML='';
  if(!S.selectedConv) return;
  var list=S.msgs[S.selectedConv.chat_session_id]||[];
  list.forEach(function(mi){
    var isSelf=mi.sender&&mi.sender.user_id===S.myUserId;
    var senderName=(mi.sender&&mi.sender.nickname)||'';
    var row=document.createElement('div');
    row.className='msg-row'+(isSelf?' self':'');

    var ava=document.createElement('div'); ava.className='ava';
    if(mi.sender&&mi.sender.avatar&&mi.sender.avatar.length){
      var img=document.createElement('img'); img.src='data:image/jpeg;base64,'+bytesToBase64(mi.sender.avatar); ava.appendChild(img);
    } else { ava.textContent=(senderName||'?').charAt(0); }

    var wrap=document.createElement('div'); wrap.className='wrap';
    if(!isSelf&&senderName){ var sn=document.createElement('div'); sn.className='sender-name'; sn.textContent=senderName; wrap.appendChild(sn); }

    var bubble=document.createElement('div');
    bubble.className='bubble '+(isSelf?'self':'other');
    var mc=mi.message;
    if(mc){
      var MT=penum('MessageType');
      if(mc.message_type===MT.STRING&&mc.string_message){
        bubble.textContent=mc.string_message.content||'';
      } else if(mc.message_type===MT.IMAGE&&mc.image_message){
        bubble.style.padding='4px';
        var imgEl=document.createElement('img'); imgEl.className='chat-img';
        if(mc.image_message.image_content&&mc.image_message.image_content.length){
          imgEl.src='data:image/jpeg;base64,'+bytesToBase64(mc.image_message.image_content);
        } else if(mc.image_message.file_id){
          imgEl.src=''; imgEl.alt='[图片]';
          (function(fid,el){ apiPost('/chat/file/get_single_file', pb('GetSingleFileReq'),
            {request_id:uuid(),session_id:S.sessionId,file_id:fid},pb('GetSingleFileRsp'))
            .then(function(r){ if(r.success&&r.file_data&&r.file_data.file_content)
              el.src='data:image/jpeg;base64,'+bytesToBase64(r.file_data.file_content);
            }).catch(function(){}); })(mc.image_message.file_id, imgEl);
        }
        imgEl.addEventListener('click',function(){ window.open(imgEl.src,'_blank'); });
        bubble.appendChild(imgEl);
      } else if(mc.message_type===MT.FILE&&mc.file_message){
        bubble.classList.add('file-bubble');
        var fi=mc.file_message;
        bubble.innerHTML='<div class="file-icon">📄</div><div class="file-info"><div class="fname">'+esc(fi.file_name||'文件')+'</div><div class="fsize">'+fmtSize(fi.file_size||0)+'</div></div>';
        bubble.style.cursor='pointer';
        bubble.addEventListener('click',function(){ downloadFile(fi.file_id,fi.file_name); });
      } else if(mc.message_type===MT.SPEECH){
        bubble.textContent='[语音消息]';
      } else {
        bubble.textContent='[消息]';
      }
    }
    var timeEl=document.createElement('div'); timeEl.className='msg-time'; timeEl.textContent=fmtTime(mi.timestamp);
    wrap.appendChild(bubble); wrap.appendChild(timeEl);
    row.appendChild(ava); row.appendChild(wrap);
    area.appendChild(row);
  });
  area.scrollTop=area.scrollHeight;
}

  el('profilePanel').classList.remove('hidden');

(function(){
  var proto = location.protocol;
  var host  = location.host;
  var wsProto = proto === 'https:' ? 'wss:' : 'ws:';
  el('apiBase').value = proto + '//' + host;
  el('wsBase').value  = wsProto + '//' + host + '/ws';
})();

// Auth tabs
document.querySelectorAll('.auth-tab').forEach(function(tab){
  tab.addEventListener('click',function(){ switchAuthTab(tab.dataset.tab); });
});
function switchAuthTab(t){
  document.querySelectorAll('.auth-tab').forEach(function(x){ x.classList.toggle('active',x.dataset.tab===t); });
  el('loginForm').classList.toggle('hidden',t!=='login');
  el('registerForm').classList.toggle('hidden',t!=='register');
}

el('btnLogin').addEventListener('click',function(){
  var nick=el('loginNick').value.trim(), pwd=el('loginPwd').value;
  S.apiBase=el('apiBase').value.trim().replace(/\/$/,'');
  S.wsBase=el('wsBase').value.trim();
  if(!nick){ showToast('请输入昵称'); return; }
  el('btnLogin').disabled=true;
  doLogin(nick,pwd).catch(function(e){ showToast(e.message||'登录失败'); })
    .finally(function(){ el('btnLogin').disabled=false; });
});
el('btnRegister').addEventListener('click',function(){
  var nick=el('regNick').value.trim(), pwd=el('regPwd').value;
  S.apiBase=el('apiBase').value.trim().replace(/\/$/,'');
  if(!nick||!pwd){ showToast('请填写昵称和密码'); return; }
  el('btnRegister').disabled=true;
  doRegister(nick,pwd).catch(function(e){ showToast(e.message||'注册失败'); })
    .finally(function(){ el('btnRegister').disabled=false; });
});

// Nav
el('navChat').addEventListener('click',function(){ switchTab('chat'); });
el('navContacts').addEventListener('click',function(){ switchTab('contacts'); loadFriends(); });
el('navSearch').addEventListener('click',function(){ switchTab('search'); el('searchResults').innerHTML=''; });

// 搜索好友
el('btnSearch').addEventListener('click',function(){
  var kw=el('searchInput').value.trim();
  if(!kw){ showToast('请输入关键词'); return; }
  searchFriend(kw);
});
el('searchInput').addEventListener('keydown',function(e){ if(e.key==='Enter') el('btnSearch').click(); });

// 联系人搜索过滤
el('contactSearch').addEventListener('input',function(){ renderContactList(); });

// 建群
el('btnCreateGroup').addEventListener('click',openCreateGroupModal);
el('btnConfirmGroup').addEventListener('click',confirmCreateGroup);
el('btnCancelGroup').addEventListener('click',function(){ el('modalCreateGroup').classList.add('hidden'); });
el('modalCreateGroup').addEventListener('click',function(e){ if(e.target===this) this.classList.add('hidden'); });

// 好友申请
el('btnShowPending').addEventListener('click',function(){
  S.pendingBadge=0; renderNavBadge();
  el('modalPending').classList.remove('hidden');
});
el('btnClosePending').addEventListener('click',function(){ el('modalPending').classList.add('hidden'); });
el('modalPending').addEventListener('click',function(e){ if(e.target===this) this.classList.add('hidden'); });

// 详情侧栏
el('btnToggleProfile').addEventListener('click',function(){
  S.showProfile=!S.showProfile; renderProfilePanel();
});

// 发送消息
el('btnSend').addEventListener('click',doSend);
el('msgInput').addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); doSend(); }
});
function doSend(){
  var text=el('msgInput').value.trim();
  if(!text||!S.selectedConv) return;
  el('msgInput').value='';
  sendTextMsg(text).then(function(){
    // 本地立即展示（WS 推送也会来一次，ingestMsg 去重）
    ingestMsg({
      message_id:'local_'+Date.now(),
      chat_session_id:S.selectedConv.chat_session_id,
      timestamp:Date.now(),
      sender:{user_id:S.myUserId,nickname:S.myNick},
      message:{message_type:0,string_message:{content:text}}
    });
  }).catch(function(e){ showToast(e.message||'发送失败'); });
}

// 图片上传
el('imgInput').addEventListener('change',function(){
  var file=this.files[0]; if(!file||!S.selectedConv) return;
  this.value='';
  uploadFile(file).then(function(info){
    var reader=new FileReader();
    reader.onload=function(e){
      var bytes=new Uint8Array(e.target.result);
      sendImageMsg(info.file_id,bytes);
    };
    reader.readAsArrayBuffer(file);
  }).catch(function(e){ showToast(e.message||'上传失败'); });
});

// 文件上传
el('fileInput').addEventListener('change',function(){
  var file=this.files[0]; if(!file||!S.selectedConv) return;
  this.value='';
  uploadFile(file).then(function(info){
    sendFileMsg(info.file_id, info.file_name||file.name, info.file_size||file.size);
  }).catch(function(e){ showToast(e.message||'上传失败'); });
});

})();
</script>
</body>
</html>
