<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>微信 - 聊天</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", STHeiti, "Microsoft Yahei", sans-serif;
      font-size: 14px;
      color: #333;
      background: #ededed;
      height: 100vh;
      overflow: hidden;
    }

    /* ---------- 登录页 ---------- */
    .login-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(180deg, #393a3e 0%, #2c2d30 100%);
    }
    .login-box {
      width: 360px;
      padding: 40px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.15);
    }
    .login-box h1 {
      margin: 0 0 24px 0;
      font-size: 22px;
      font-weight: 500;
      text-align: center;
      color: #333;
    }
    .login-box .field {
      margin-bottom: 16px;
    }
    .login-box label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: #666;
    }
    .login-box input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      font-size: 14px;
    }
    .login-box input:focus {
      outline: none;
      border-color: #07c160;
    }
    .login-box .btn-login {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      font-size: 16px;
      color: #fff;
      background: #07c160;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .login-box .btn-login:hover { background: #06ad56; }
    .login-box .btn-demo {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      font-size: 14px;
      color: #07c160;
      background: transparent;
      border: 1px solid #07c160;
      border-radius: 4px;
      cursor: pointer;
    }
    .login-box .btn-demo:hover { background: rgba(7,193,96,0.08); }
    .login-page.hidden { display: none; }

    /* ---------- 主布局：微信风格 ---------- */
    .app-main {
      display: none;
      flex;
      height: 100vh;
      background: #ededed;
    }
    .app-main.show {
      display: flex;
    }

    /* 左侧：会话列表 */
    .sidebar {
      width: 260px;
      min-width: 260px;
      background: #f7f7f7;
      border-right: 1px solid #e7e7e7;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-header {
      height: 60px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      background: #f7f7f7;
      border-bottom: 1px solid #e7e7e7;
    }
    .sidebar-header .avatar-wrap {
      width: 40px;
      height: 40px;
      border-radius: 4px;
      background: #07c160;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      margin-right: 12px;
      flex-shrink: 0;
    }
    .sidebar-header .user-name {
      flex: 1;
      font-size: 16px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .conversation-list {
      flex: 1;
      overflow-y: auto;
    }
    .conversation-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
      background: #fff;
      transition: background 0.15s;
    }
    .conversation-item:hover { background: #f0f0f0; }
    .conversation-item.active {
      background: #e7e7e7;
    }
    .conversation-item .avatar {
      width: 44px;
      height: 44px;
      border-radius: 4px;
      background: #ddd;
      color: #666;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      margin-right: 12px;
      flex-shrink: 0;
    }
    .conversation-item .body {
      flex: 1;
      min-width: 0;
    }
    .conversation-item .name {
      font-size: 15px;
      color: #333;
      margin-bottom: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .conversation-item .preview {
      font-size: 13px;
      color: #999;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .conversation-item .meta {
      flex-shrink: 0;
      text-align: right;
    }
    .conversation-item .time {
      font-size: 12px;
      color: #999;
      margin-bottom: 2px;
    }
    .conversation-item .unread {
      display: inline-block;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      line-height: 18px;
      font-size: 12px;
      color: #fff;
      background: #fa5151;
      border-radius: 9px;
      text-align: center;
    }
    .conversation-item .unread.none { display: none; }

    /* 右侧：聊天区域 */
    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: #fff;
    }
    .chat-header {
      height: 60px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      background: #f7f7f7;
      border-bottom: 1px solid #e7e7e7;
    }
    .chat-header .title {
      flex: 1;
      font-size: 16px;
      font-weight: 500;
      text-align: center;
    }
    .chat-header .actions {
      width: 80px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .chat-header .icon-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      color: #666;
      font-size: 18px;
      cursor: pointer;
      border-radius: 4px;
    }
    .chat-header .icon-btn:hover { background: #e0e0e0; color: #333; }

    .chat-placeholder {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 14px;
      background: #f5f5f5;
    }
    .chat-messages-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: #f5f5f5;
      display: none;
    }
    .chat-messages-wrap.show { display: block; }

    .msg-date-divider {
      text-align: center;
      margin: 16px 0;
      font-size: 12px;
      color: #999;
    }
    .msg-row {
      display: flex;
      margin-bottom: 16px;
      align-items: flex-start;
    }
    .msg-row.self {
      flex-direction: row-reverse;
    }
    .msg-row .avatar {
      width: 40px;
      height: 40px;
      border-radius: 4px;
      background: #ddd;
      color: #666;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      margin: 0 8px;
    }
    .msg-row .bubble-wrap {
      max-width: 60%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .msg-row.self .bubble-wrap { align-items: flex-end; }
    .msg-row .bubble {
      padding: 10px 14px;
      border-radius: 4px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
      max-width: 100%;
    }
    .msg-row .bubble.other {
      background: #fff;
      color: #333;
      border: 1px solid #e7e7e7;
      border-top-left-radius: 0;
    }
    .msg-row .bubble.self {
      background: #95ec69;
      color: #333;
      border-top-right-radius: 0;
    }
    .msg-row .time {
      margin-top: 4px;
      font-size: 12px;
      color: #999;
    }
    .msg-row.self .time { text-align: right; }

    .chat-input-wrap {
      padding: 12px 16px;
      background: #f7f7f7;
      border-top: 1px solid #e7e7e7;
      display: none;
    }
    .chat-input-wrap.show { display: block; }
    .chat-input-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }
    .chat-input-row textarea {
      flex: 1;
      min-height: 40px;
      max-height: 120px;
      padding: 10px 12px;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
    }
    .chat-input-row textarea:focus {
      outline: none;
      border-color: #07c160;
    }
    .chat-input-row .btn-send {
      width: 48px;
      height: 40px;
      padding: 0;
      font-size: 14px;
      color: #fff;
      background: #07c160;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .chat-input-row .btn-send:hover { background: #06ad56; }
    .chat-input-row .btn-send:disabled {
      background: #c0c0c0;
      cursor: not_allowed;
    }
  </style>
</head>
<body>
  <!-- 登录页 -->
  <div class="login-page" id="loginPage">
    <div class="login-box">
      <h1>微信</h1>
      <div class="field">
        <label>用户名</label>
        <input type="text" id="loginUsername" placeholder="请输入用户名" value="" />
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="loginPassword" placeholder="请输入密码" value="" />
      </div>
      <div class="field">
        <label>HTTP 接口地址</label>
        <input type="text" id="apiBase" placeholder="http://localhost:8080" value="http://localhost:8080" />
      </div>
      <div class="field">
        <label>WebSocket 地址</label>
        <input type="text" id="wsBase" placeholder="ws://localhost:9090" value="ws://localhost:9090" />
      </div>
      <button type="button" class="btn-login" id="btnLogin">登录（对接 chat-server-cpp）</button>
      <button type="button" class="btn-demo" id="btnDemo">演示模式（不请求后端）</button>
    </div>
  </div>

  <!-- 主界面：微信布局 -->
  <div class="app-main" id="appMain">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="avatar-wrap" id="currentUserAvatar">我</div>
        <span class="user-name" id="currentUserName">我</span>
      </div>
      <div class="conversation-list" id="conversationList"></div>
    </aside>
    <main class="chat-panel">
      <div class="chat-header">
        <div class="title" id="chatTitle">请从左侧选择一个会话</div>
        <div class="actions">
          <button type="button" class="icon-btn" title="更多">⋯</button>
        </div>
      </div>
      <div class="chat-placeholder" id="chatPlaceholder">在左侧选择会话开始聊天</div>
      <div class="chat-messages-wrap" id="chatMessagesWrap">
        <div class="chat-messages" id="chatMessages"></div>
      </div>
      <div class="chat-input-wrap" id="chatInputWrap">
        <div class="chat-input-row">
          <textarea id="chatInput" placeholder="输入消息..." rows="1"></textarea>
          <button type="button" class="btn-send" id="btnSend">发送</button>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/protobufjs@7/dist/protobuf.min.js"></script>
  <script>
    (function () {
      var loginPage = document.getElementById('loginPage');
      var appMain = document.getElementById('appMain');
      var conversationList = document.getElementById('conversationList');
      var chatPlaceholder = document.getElementById('chatPlaceholder');
      var chatMessagesWrap = document.getElementById('chatMessagesWrap');
      var chatMessages = document.getElementById('chatMessages');
      var chatInputWrap = document.getElementById('chatInputWrap');
      var chatInput = document.getElementById('chatInput');
      var chatTitle = document.getElementById('chatTitle');
      var btnLogin = document.getElementById('btnLogin');
      var btnDemo = document.getElementById('btnDemo');
      var btnSend = document.getElementById('btnSend');
      var currentUserAvatar = document.getElementById('currentUserAvatar');
      var currentUserName = document.getElementById('currentUserName');

      var currentUser = { id: 'me', name: '我', avatar: '我' };
      var selectedId = null;
      var sessionId = null;
      var apiBase = '';
      var wsBase = '';
      var ws = null;
      var pbRoot = null;
      var useBackend = false;
      var ackQueue = [];
      var myUserId = '';

      var conversations = [];
      var messagesByChat = {};

      function uuid() {
        return typeof crypto !== 'undefined' && crypto.randomUUID
          ? crypto.randomUUID() : ('x' + Date.now().toString(36) + Math.random().toString(36).substr(2, 9));
      }
      function timeStr(ts) {
        if (ts) {
          var d = new Date(Number(ts));
          return (d.getHours() < 10 ? '0' : '') + d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
        }
        var d = new Date();
        return (d.getHours() < 10 ? '0' : '') + d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
      }
      function escapeHtml(s) {
        if (!s) return '';
        var div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
      }

      function loadProtos() {
        if (pbRoot) return Promise.resolve(pbRoot);
        var root = new protobuf.Root();
        root.resolvePath = function(origin, target) { return (origin ? origin + '/' : '') + target; };
        return root.load("proto/base.proto")
          .then(function() { return root.load("proto/user.proto"); })
          .then(function() { return root.load("proto/friend.proto"); })
          .then(function() { return root.load("proto/message.proto"); })
          .then(function() { return root.load("proto/transmite.proto"); })
          .then(function() { return root.load("proto/notify.proto"); })
          .then(function() { return root.load("proto/gateway.proto"); })
          .then(function() { pbRoot = root; return root; });
      }

      function apiPost(path, ReqType, reqObj, RspType) {
        var reqMsg = ReqType.create(reqObj);
        var buf = ReqType.encode(reqMsg).finish();
        return fetch(apiBase + path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-protobuf' },
          body: buf
        }).then(function(res) { return res.arrayBuffer(); }).then(function(ab) {
          return RspType.decode(new Uint8Array(ab));
        });
      }
      function apiGet(path, ReqType, reqObj, RspType) {
        var reqMsg = ReqType.create(reqObj);
        var buf = ReqType.encode(reqMsg).finish();
        return fetch(apiBase + path, {
          method: 'GET',
          headers: { 'Content-Type': 'application/x-protobuf' },
          body: buf
        }).then(function(res) { return res.arrayBuffer(); }).then(function(ab) {
          return RspType.decode(new Uint8Array(ab));
        });
      }

      function connectWs() {
        if (!wsBase || !sessionId) return;
        ws = new WebSocket(wsBase);
        ws.binaryType = 'arraybuffer';
        var ClientAuthReq = pbRoot.lookupType('MY_IM.ClientAuthenticationReq');
        ws.onopen = function() {
          var auth = ClientAuthReq.encode(ClientAuthReq.create({ request_id: uuid(), session_id: sessionId })).finish();
          ws.send(auth);
        };
        ws.onmessage = function(ev) {
          var NotifyMsg = pbRoot.lookupType('MY_IM.NotifyMessage');
          var msg = NotifyMsg.decode(new Uint8Array(ev.data));
          if (msg.notify_event_id) ackQueue.push(msg.notify_event_id);
          if (msg.notify_type === 3 && msg.new_message_info && msg.new_message_info.message_info) {
            var mi = msg.new_message_info.message_info;
            appendMessageFromProto(mi);
          } else if (msg.notify_type === 5) {
            fetchSync();
          }
          flushAck();
        };
        ws.onclose = function() { ws = null; };
        ws.onerror = function() { ws = null; };
      }
      function flushAck() {
        if (ackQueue.length === 0 || !ws || ws.readyState !== WebSocket.OPEN) return;
        var AckReq = pbRoot.lookupType('MY_IM.NotifyAckReq');
        var buf = AckReq.encode(AckReq.create({ request_id: uuid(), notify_event_id_list: ackQueue })).finish();
        ws.send(buf);
        ackQueue = [];
      }
      function appendMessageFromProto(mi) {
        var cid = mi.chat_session_id || '';
        var list = messagesByChat[cid] || (messagesByChat[cid] = []);
        var text = '';
        if (mi.message && mi.message.string_message) text = mi.message.string_message.content || '';
        var senderName = (mi.sender && mi.sender.nickname) ? mi.sender.nickname : (mi.sender && mi.sender.user_id) ? mi.sender.user_id : '?';
        var isSelf = mi.sender && mi.sender.user_id === myUserId;
        list.push({ from: isSelf ? 'self' : 'other', text: text, time: timeStr(mi.timestamp), message_id: mi.message_id, senderName: senderName });
        var conv = conversations.find(function(c) { return c.id === cid; });
        if (conv) { conv.lastMsg = text; conv.time = timeStr(mi.timestamp); }
        renderConversationList();
        if (selectedId === cid) renderMessages(cid);
      }
      function fetchSync() {
        if (!sessionId || !pbRoot) return;
        var Req = pbRoot.lookupType('MY_IM.GetSyncMsgReq');
        var Rsp = pbRoot.lookupType('MY_IM.GetSyncMsgRsp');
        var maxId = 0;
        Object.keys(messagesByChat).forEach(function(cid) {
          (messagesByChat[cid] || []).forEach(function(m) { if (m.message_id) maxId = Math.max(maxId, parseInt(m.message_id, 10) || 0); });
        });
        apiGet('/chat/message_storage/get_sync', Req, { request_id: uuid(), cur_max_message_id: maxId, session_id: sessionId }, Rsp)
          .then(function(rsp) {
            if (rsp.success && rsp.msg_list) for (var i = 0; i < rsp.msg_list.length; i++) appendMessageFromProto(rsp.msg_list[i]);
          })
          .catch(function() {});
      }

      function loadSessionList() {
        if (!pbRoot) return;
        var Req = pbRoot.lookupType('MY_IM.GetChatSessionListReq');
        var Rsp = pbRoot.lookupType('MY_IM.GetChatSessionListRsp');
        apiGet('/chat/friend/get_chat_session_list', Req, { request_id: uuid(), session_id: sessionId }, Rsp)
          .then(function(rsp) {
            if (!rsp.success) return;
            conversations = (rsp.chat_session_info_list || []).map(function(s) {
              var prev = s.prev_message && s.prev_message.message && s.prev_message.message.string_message ? s.prev_message.message.string_message.content : '';
              return {
                id: s.chat_session_id,
                name: s.chat_session_name || s.chat_session_id,
                avatar: (s.chat_session_name && s.chat_session_name.charAt(0)) || '会',
                lastMsg: prev || '[会话]',
                time: s.prev_message && s.prev_message.timestamp ? timeStr(s.prev_message.timestamp) : '',
                unread: 0
              };
            });
            renderConversationList();
          })
          .catch(function(err) { console.warn('拉取会话列表失败', err); });
      }

      function loadRecentMessages(chatSessionId) {
        if (!pbRoot) return;
        var Req = pbRoot.lookupType('MY_IM.GetRecentMsgReq');
        var Rsp = pbRoot.lookupType('MY_IM.GetRecentMsgRsp');
        apiGet('/chat/message_storage/get_recent', Req, {
          request_id: uuid(),
          chat_session_id: chatSessionId,
          msg_count: 50,
          session_id: sessionId
        }, Rsp).then(function(rsp) {
          if (!rsp.success || !rsp.msg_list) return;
          var list = messagesByChat[chatSessionId] || (messagesByChat[chatSessionId] = []);
          for (var i = 0; i < rsp.msg_list.length; i++) {
            var mi = rsp.msg_list[i];
            var text = mi.message && mi.message.string_message ? mi.message.string_message.content : '';
            var isSelf = mi.sender && mi.sender.user_id === myUserId;
            list.push({ from: isSelf ? 'self' : 'other', text: text, time: timeStr(mi.timestamp), message_id: mi.message_id });
          }
          renderMessages(chatSessionId);
        }).catch(function(err) { console.warn('拉取消息失败', err); });
      }

      function sendMessageToBackend(text) {
        if (!pbRoot || !sessionId || !selectedId) return Promise.reject();
        var Req = pbRoot.lookupType('MY_IM.NewMessageReq');
        var Rsp = pbRoot.lookupType('MY_IM.NewMessageRsp');
        var StringMsg = pbRoot.lookupType('MY_IM.StringMessageInfo');
        var Content = pbRoot.lookupType('MY_IM.MessageContent');
        var MessageType = pbRoot.lookupEnum('MY_IM.MessageType').values;
        var content = Content.create({ message_type: MessageType.STRING, string_message: StringMsg.create({ content: text }) });
        return apiPost('/chat/message_transmit/new_message', Req, {
          request_id: uuid(),
          session_id: sessionId,
          chat_session_id: selectedId,
          message: content
        }, Rsp);
      }

      function renderConversationList() {
        conversationList.innerHTML = conversations.map(function (c) {
          var active = c.id === selectedId ? ' active' : '';
          var unreadCls = (c.unread > 0) ? '' : ' none';
          return '<div class="conversation-item' + active + '" data-id="' + escapeHtml(c.id) + '">' +
            '<div class="avatar">' + escapeHtml(c.avatar || (c.name && c.name.charAt(0)) || '?') + '</div>' +
            '<div class="body">' +
              '<div class="name">' + escapeHtml(c.name) + '</div>' +
              '<div class="preview">' + escapeHtml(c.lastMsg) + '</div>' +
            '</div>' +
            '<div class="meta">' +
              '<div class="time">' + escapeHtml(c.time) + '</div>' +
              '<span class="unread' + unreadCls + '">' + (c.unread > 99 ? '99+' : c.unread) + '</span>' +
            '</div>' +
          '</div>';
        }).join('');
      }

      function renderMessages(chatId) {
        var list = messagesByChat[chatId] || [];
        var lastDate = '';
        var html = '';
        list.forEach(function (m) {
          var t = m.time || timeStr();
          if (t !== lastDate) { lastDate = t; html += '<div class="msg-date-divider">' + escapeHtml(t) + '</div>'; }
          var isSelf = m.from === 'self';
          html += '<div class="msg-row ' + (isSelf ? 'self' : '') + '">' +
            '<div class="avatar">' + escapeHtml(isSelf ? (currentUser.avatar || currentUser.name) : (m.senderName || (conversations.find(function(c){ return c.id === chatId; }) || {}).name || '?')) + '</div>' +
            '<div class="bubble-wrap">' +
              '<div class="bubble ' + (isSelf ? 'self' : 'other') + '">' + escapeHtml(m.text) + '</div>' +
              '<div class="time">' + escapeHtml(t) + '</div>' +
            '</div></div>';
        });
        chatMessages.innerHTML = html;
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      function selectChat(chatId) {
        selectedId = chatId;
        var conv = conversations.find(function (c) { return c.id === chatId; });
        if (conv) { conv.unread = 0; chatTitle.textContent = conv.name; }
        chatPlaceholder.style.display = 'none';
        chatMessagesWrap.classList.add('show');
        chatInputWrap.classList.add('show');
        renderConversationList();
        if (useBackend) loadRecentMessages(chatId);
        else renderMessages(chatId);
        chatInput.focus();
      }

      function sendMessage() {
        var text = (chatInput.value || '').trim();
        if (!text || !selectedId) return;
        if (useBackend && pbRoot) {
          sendMessageToBackend(text).then(function(rsp) {
            if (rsp.success) {
              var list = messagesByChat[selectedId] || (messagesByChat[selectedId] = []);
              list.push({ from: 'self', text: text, time: timeStr() });
              var conv = conversations.find(function (c) { return c.id === selectedId; });
              if (conv) { conv.lastMsg = text; conv.time = timeStr(); }
              chatInput.value = '';
              renderMessages(selectedId);
              renderConversationList();
            } else alert(rsp.errmsg || '发送失败');
          }).catch(function(err) { alert('发送失败：' + (err && err.message ? err.message : '网络错误')); });
        } else {
          var list = messagesByChat[selectedId] || (messagesByChat[selectedId] = []);
          list.push({ from: 'self', text: text, time: timeStr() });
          var conv = conversations.find(function (c) { return c.id === selectedId; });
          if (conv) { conv.lastMsg = text; conv.time = timeStr(); }
          chatInput.value = '';
          renderMessages(selectedId);
          renderConversationList();
        }
      }

      function enterApp(user, backend) {
        useBackend = !!backend;
        currentUser = user || currentUser;
        currentUserAvatar.textContent = (currentUser.avatar || currentUser.name || '我').charAt(0);
        currentUserName.textContent = currentUser.name || '我';
        loginPage.classList.add('hidden');
        appMain.classList.add('show');
        if (useBackend) {
          loadSessionList();
          connectWs();
        } else {
          conversations = [
            { id: '1', name: '张三', avatar: '张', lastMsg: '你好呀', time: '09:30', unread: 2 },
            { id: '2', name: '李四', avatar: '李', lastMsg: '在吗？', time: '昨天', unread: 0 },
            { id: '3', name: '产品群', avatar: '群', lastMsg: '小明：大家看一下需求', time: '昨天', unread: 5 }
          ];
          messagesByChat = {
            '1': [ { from: 'other', text: '在吗？', time: '09:28' }, { from: 'self', text: '在的', time: '09:29' }, { from: 'other', text: '你好呀', time: '09:30' } ],
            '2': [ { from: 'other', text: '在吗？', time: '昨天 18:00' } ],
            '3': [ { from: 'other', text: '小明：大家看一下需求', time: '昨天 20:00' } ]
          };
        }
        renderConversationList();
      }

      btnDemo.addEventListener('click', function () {
        apiBase = document.getElementById('apiBase').value.trim().replace(/\/$/, '');
        enterApp({ id: 'me', name: '我', avatar: '我' }, false);
      });

      btnLogin.addEventListener('click', function () {
        var nickname = document.getElementById('loginUsername').value.trim();
        var password = document.getElementById('loginPassword').value;
        apiBase = document.getElementById('apiBase').value.trim().replace(/\/$/, '');
        wsBase = (document.getElementById('wsBase') && document.getElementById('wsBase').value.trim()) || 'ws://localhost:9090';
        if (!nickname) { alert('请输入用户名（昵称）'); return; }
        if (!apiBase) { alert('请输入 HTTP 接口地址'); return; }
        btnLogin.disabled = true;
        loadProtos()
          .then(function() {
            var Req = pbRoot.lookupType('MY_IM.UserLoginReq');
            var Rsp = pbRoot.lookupType('MY_IM.UserLoginRsp');
            return apiPost('/chat/user/username_login', Req, { request_id: uuid(), nickname: nickname, password: password || '' }, Rsp);
          })
          .then(function(rsp) {
            if (!rsp.success) throw new Error(rsp.errmsg || '登录失败');
            sessionId = rsp.login_session_id;
            myUserId = '';
            localStorage.setItem('session_id', sessionId);
            var GetUserReq = pbRoot.lookupType('MY_IM.GetUserInfoReq');
            var GetUserRsp = pbRoot.lookupType('MY_IM.GetUserInfoRsp');
            return apiGet('/chat/user/get_user_info', GetUserReq, { request_id: uuid(), session_id: sessionId }, GetUserRsp);
          })
          .then(function(rsp) {
            if (rsp.success && rsp.user_info) myUserId = rsp.user_info.user_id || '';
            enterApp({ id: myUserId || 'me', name: (rsp.user_info && rsp.user_info.nickname) ? rsp.user_info.nickname : nickname, avatar: nickname.charAt(0) }, true);
          })
          .catch(function(err) { alert('登录失败：' + (err && err.message ? err.message : String(err))); })
          .finally(function() { btnLogin.disabled = false; });
      });

      conversationList.addEventListener('click', function (e) {
        var item = e.target.closest('.conversation-item');
        if (item) selectChat(item.getAttribute('data-id'));
      });

      btnSend.addEventListener('click', sendMessage);
      chatInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
      });
    })();
  </script>
</body>
</html>
