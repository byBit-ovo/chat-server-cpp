<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>聊天 - 登录</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
    }
    .card {
      background: #fff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 360px;
    }
    h1 {
      margin: 0 0 1.5rem 0;
      font-size: 1.25rem;
      color: #333;
    }
    .field {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.9rem;
      color: #666;
    }
    input {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 1rem;
    }
    input:focus {
      outline: none;
      border-color: #07c160;
    }
    button {
      width: 100%;
      padding: 0.75rem;
      margin-top: 0.5rem;
      font-size: 1rem;
      color: #fff;
      background: #07c160;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #06ad56; }
    button:disabled {
      background: #ccc;
      cursor: not_allowed;
    }
    .result {
      margin-top: 1.25rem;
      padding: 0.75rem;
      background: #f8f8f8;
      border-radius: 4px;
      font-size: 0.85rem;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 200px;
      overflow-y: auto;
    }
    .result.error { background: #ffebee; color: #c62828; }
    .result.success { background: #e8f5e9; color: #2e7d32; }
    .hint {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>登录</h1>
    <form id="loginForm">
      <div class="field">
        <label for="username">用户名</label>
        <input id="username" name="username" type="text" placeholder="请输入用户名" required />
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" placeholder="请输入密码" required />
      </div>
      <div class="field">
        <label for="apiBase">接口地址（后端网关 HTTP 根地址）</label>
        <input id="apiBase" type="text" value="http://localhost:8080" placeholder="http://localhost:8080" />
      </div>
      <button type="submit" id="btnSubmit">登录</button>
    </form>
    <div id="result" class="result" style="display: none;"></div>
    <p class="hint">登录接口：POST /chat/user/username_login。若返回反序列化失败，说明当前网关为 protobuf，需在网关增加 JSON 登录或前端接入 protobuf。</p>
  </div>

  <script>
    (function () {
      var form = document.getElementById('loginForm');
      var resultEl = document.getElementById('result');
      var btn = document.getElementById('btnSubmit');

      function showResult(text, isError) {
        resultEl.textContent = text;
        resultEl.className = 'result ' + (isError ? 'error' : 'success');
        resultEl.style.display = 'block';
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var username = document.getElementById('username').value.trim();
        var password = document.getElementById('password').value;
        var apiBase = document.getElementById('apiBase').value.trim().replace(/\/$/, '');
        var url = apiBase + '/chat/user/username_login';

        btn.disabled = true;
        resultEl.style.display = 'none';

        fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password })
        })
          .then(function (res) {
            return res.text().then(function (body) {
              return { status: res.status, statusText: res.statusText, body: body };
            });
          })
          .then(function (data) {
            var msg = 'HTTP ' + data.status + ' ' + data.statusText + '\n\n';
            try {
              var json = JSON.parse(data.body);
              msg += JSON.stringify(json, null, 2);
              if (json.session_id) {
                localStorage.setItem('session_id', json.session_id);
                msg += '\n\n[session_id 已写入 localStorage]';
              }
            } catch (_) {
              msg += data.body || '(空响应)';
              if (data.body && data.body.length > 0 && data.status === 200) {
                msg += '\n\n(当前为二进制 protobuf 响应，前端需接入 protobuf 或后端提供 JSON 响应)';
              }
            }
            showResult(msg, data.status >= 400);
          })
          .catch(function (err) {
            showResult('请求失败：' + err.message + '\n\n请确认：\n1. 网关已启动；\n2. 接口地址正确；\n3. 若跨域，需后端开启 CORS。', true);
          })
          .finally(function () {
            btn.disabled = false;
          });
      });
    })();
  </script>
</body>
</html>
